name: Aki Dev CI
on:
  pull_request:
    branches: [main]
    paths:
      - '**.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run check:agent
      - run: node --check server.js
      - run: node --check public/script.js
